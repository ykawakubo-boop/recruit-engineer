<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2weeksインターンシップ | ITエンジニア | ダイアモンドヘッド株式会社</title>
    
    <style>
        /* =========================================
           1. 全体設定・フォント読み込み（各採用ページ完全共通）
           ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap');

        :root {
            --bg-base: #ffffff;
            --text-dark: #111111;
            --text-muted: #555555;
            --border-color: #e2e8f0;
            --accent-blue: #00bfa5; 
        }

        html { scroll-behavior: smooth; }

        body, html {
            margin: 0; padding: 0; width: 100%;
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* レフトナビゲーション用大枠レイアウト */
        .app-wrapper {
            display: flex;
            align-items: flex-start;
            width: 100%;
            min-height: 100vh;
        }

        /* =========================================
           2. レフトナビゲーション（階層ツリー構造・ホバー展開式）のスタイル
           ※表示はsidebar.jsに任せますが、表示中の崩れを防ぐためのCSSです
           ★全体の統一感を出すため、余白・フォントサイズを新卒採用ページと同じ黄金比に統一しました
           ========================================= */
        .left-nav {
            width: 280px;
            height: 100vh;
            position: fixed; 
            top: 0;
            left: 0;
            background-color: #ffffff;
            border-right: 1px solid var(--border-color);
            padding: 50px 40px; /* 40px 30pxから50px 40pxに統一 */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            overflow-y: auto; 
        }

        /* カスタムスクロールバー */
        .left-nav::-webkit-scrollbar {
            width: 4px;
        }
        .left-nav::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .nav-logo {
            text-decoration: none; margin-bottom: 60px; display: block; text-align: center; /* 40pxから60pxに変更 */
        }
        .nav-logo img {
            width: 100%; max-width: 180px; height: auto; display: block; margin: 0 auto; /* 160pxから180pxに統一 */
        }
        .nav-logo .logo-text {
            display: block; font-family: 'Noto Sans JP', sans-serif; font-size: 11px; font-weight: 700; /* 10pxから11pxに統一 */
            color: #555555; letter-spacing: 0.15em; margin-top: 16px; line-height: 1.6; /* 12pxから16pxに変更 */
        }

        .nav-recruit { flex-grow: 1; }
        .nav-recruit-list { list-style: none; padding: 0; margin: 0; }
        .nav-recruit-list > li { margin-bottom: 24px; position: relative; } /* 20pxから24pxに変更 */
        .nav-recruit-list a {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 14px; font-weight: 700; color: #333; text-decoration: none; /* 13.5px / #444 から 14px / #333 に統一 */
            display: flex; align-items: center; justify-content: space-between; transition: color 0.3s;
        }
        .nav-recruit-list a:hover, .nav-recruit-list a.active { color: var(--accent-blue); }

        /* 第2階層 */
        .nav-sub-list {
            list-style: none;
            padding: 0 0 0 12px;
            margin: 0;
            border-left: 1px solid var(--border-color);
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.4s ease, padding 0.4s ease;
        }
        
        /* インターンシップにホバー、または配下のa要素がアクティブな時に自動展開 */
        .nav-recruit-list li.has-sub:hover .nav-sub-list,
        .nav-recruit-list li.has-sub:focus-within .nav-sub-list,
        .nav-recruit-list li.has-sub:has(.active, .active-sub, .active-deep) .nav-sub-list {
            max-height: 800px;
            opacity: 1;
            padding: 10px 0 0 12px;
        }

        .nav-sub-list li { margin-bottom: 14px; position: relative; }
        .nav-sub-list li:last-child { margin-bottom: 0; }
        .nav-sub-list a {
            font-size: 12.5px; font-weight: 500; color: #666;
        }
        .nav-sub-list a:hover, .nav-sub-list a.active-sub { color: var(--accent-blue); }

        /* 第3階層：長期インターンシップ内の詳細 */
        .nav-deep-list {
            list-style: none;
            padding: 0 0 0 12px;
            margin: 0;
            border-left: 1px solid var(--border-color);
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.4s ease, padding 0.4s ease;
        }

        /* 長期インターンにホバーした時に自動展開 */
        .nav-recruit-list li.has-sub:hover .nav-deep-list,
        .nav-recruit-list li.has-sub:focus-within .nav-deep-list,
        .nav-recruit-list li.has-sub:has(.active, .active-sub, .active-deep) .nav-deep-list {
            max-height: 400px;
            opacity: 1;
            padding: 10px 0 0 12px;
        }

        .nav-deep-list li { margin-bottom: 10px; }
        .nav-deep-list li:last-child { margin-bottom: 0; }
        .nav-deep-list a {
            font-size: 11.5px; font-weight: 400; color: #888;
        }
        .nav-deep-list a:hover, .nav-deep-list a.active-deep {
            color: var(--accent-blue);
            font-weight: 700;
        }

        /* モバイル用ヘッダー（PCでは非表示） */
        .mobile-header {
            display: none;
        }

        /* =========================================
           3. メインコンテンツエリア
           ========================================= */
        .main-content {
            flex: 1;
            width: 100%; 
            padding-left: 280px; 
            box-sizing: border-box;
            background-color: var(--bg-base);
        }

        /* 幅広コンテナ */
        .content-container {
            padding: 80px 6%;
            box-sizing: border-box;
            max-width: 1100px; /* 横幅を1100pxに統一 */
            margin: 0 auto;
        }

        .section-tag {
            font-size: 1rem; font-weight: 700;
            color: var(--accent-blue);
            letter-spacing: 0.2em;
            margin-bottom: 16px; text-transform: uppercase;
            font-family: 'Bodoni Moda', serif;
        }

        .section-title {
            font-size: clamp(24px, 3vw, 36px); font-weight: 700; line-height: 1.4;
            margin: 0 0 30px 0; color: #111; letter-spacing: 0.02em;
        }

        /* =========================================
           4. ヒーローセクション
           ========================================= */
        .hero {
            position: relative; width: 100%; 
            height: 40vh; 
            min-height: 350px; 
            display: flex; align-items: center; justify-content: flex-start;
            box-sizing: border-box; padding: 0 6%; overflow: hidden;
            background-color: #f5f5f5;
        }

        .hero-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('../images/intern_3.jpg'); /* 正しい深さ「../」に更新 */
            background-size: cover; background-position: center;
            filter: grayscale(70%) contrast(1.1) brightness(0.7);
            z-index: 1;
        }

        .hero::before {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 150px;
            background: linear-gradient(to top, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 100%);
            z-index: 3; pointer-events: none;
        }

        .hero::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0.8) 40%, rgba(255,255,255,0.05) 80%, rgba(255,255,255,1) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative; z-index: 10;
        }

        .hero-en {
            font-family: 'Bodoni Moda', serif; font-size: clamp(32px, 5vw, 64px); font-weight: 900;
            color: #111; letter-spacing: 0.05em; line-height: 1.1; margin: 0 0 8px 0;
            opacity: 0; transform: translateY(20px); animation: fadeInUp 0.8s ease forwards 0.1s;
        }
        .hero-jp {
            font-size: 16px; font-weight: 700; color: var(--accent-blue); letter-spacing: 0.2em; margin: 0;
            opacity: 0; transform: translateY(20px); animation: fadeInUp 0.8s ease forwards 0.3s;
        }

        /* 準備中プレースホルダーボックス */
        .prep-box {
            background-color: #fafafa; border: 1px solid var(--border-color);
            padding: 50px 40px; margin: 40px 0 60px 0; text-align: center;
            font-size: 15px; color: #555; line-height: 1.8;
            border-top: 3px solid var(--accent-blue);
        }

        /* ★ ページ下部SCSKロゴ（共通CSSスタイル） */
        .scsk-bottom-logo {
            display: flex;
            justify-content: flex-end;
            padding: 20px 40px 60px;
            background-color: #ffffff;
        }
        .scsk-bottom-logo a {
            display: inline-block;
            width: 120px;
            height: auto;
            transition: transform 0.3s ease;
        }
        .scsk-bottom-logo a:hover {
            transform: translateY(-2px);
        }
        .scsk-bottom-logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* =========================================
           Responsive
           ========================================= */
        @media (max-width: 992px) {
            .app-wrapper { display: block; }
            .left-nav {
                position: fixed; top: 0; left: -100%; height: 100vh;
                transition: left 0.3s ease; box-shadow: 10px 0 30px rgba(0,0,0,0.1);
            }
            .left-nav.is-open { left: 0; }
            .main-content { width: 100%; padding-left: 0; padding-top: 0; }
            
            .mobile-header {
                display: flex; justify-content: space-between; align-items: center;
                background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px);
                padding: 15px 5%; box-sizing: border-box; border-bottom: 1px solid var(--border-color);
                position: fixed; top: 0; left: 0; width: 100%; z-index: 999;
            }
            .mobile-logo { font-family: 'Bodoni Moda', serif; font-size: 18px; font-weight: 900; color: #111; }
            .menu-toggle {
                background: none; border: none; font-family: 'Noto Sans JP', sans-serif;
                font-size: 12px; font-weight: 700; color: var(--accent-blue); cursor: pointer; padding: 10px;
            }
            .hero { margin-top: 60px; min-height: 250px; }
        }

        @media (max-width: 768px) {
            .content-container { padding: 60px 5%; }
            
            .scsk-bottom-logo {
                padding: 20px 24px 40px;
            }
            .scsk-bottom-logo a {
                width: 100px;
            }
        }
    </style>
</head>
<body data-page="intern-twoweeks">

    <div class="app-wrapper">

        <!-- ★ 共通レフトナビ（モバイルヘッダー含む）がここに読み込まれます -->
        <div id="sidebar-container"></div>

        <!-- メインコンテンツ -->
        <main class="main-content">

            <!-- HERO -->
            <section class="hero">
                <div class="hero-bg" data-local-bg="../images/intern_3.jpg" data-fallback-bg="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1600&q=80"></div>
                <div class="hero-content">
                    <h1 class="hero-en">2-WEEKS INTERNSHIP</h1>
                    <p class="hero-jp">2weeksインターンシップ</p>
                </div>
            </section>

            <div class="content-container">

                <!-- プログラムの大見出し -->
                <h2 class="section-title">2weeksインターンシップ</h2>

                <!-- 準備中プレースホルダー（すっきりとシンプルなご案内のみに調整） -->
                <div class="prep-box">
                    <p style="font-weight: 700; font-size: 18px; color: #111; margin: 0 0 10px 0;">COMING SOON</p>
                    <p style="margin: 0;">現在春期・夏期のプログラム開催に向けて準備中です。詳細、エントリー日程などは決定次第、公開いたします。</p>
                </div>

            </div> <!-- /.content-container -->

            <!-- ★ SCSKフッターロゴが自動的にこの中に挿入されます -->
            <div id="scsk-logo-container"></div>

        </main>
    </div> <!-- .app-wrapper -->

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const bgElements = document.querySelectorAll("[data-local-bg]");
            bgElements.forEach(el => {
                const localBg = el.getAttribute("data-local-bg");
                const fallbackBg = el.getAttribute("data-fallback-bg");
                if (localBg && fallbackBg) {
                    const testImg = new Image();
                    testImg.onload = function() { el.style.backgroundImage = `url('${localBg}')`; };
                    testImg.onerror = function() { el.style.backgroundImage = `url('${fallbackBg}')`; };
                    testImg.src = localBg;
                }
            });
        });
    </script>

    <!-- ★ 設定バトン： intern/twoweeks.htmlは最上位から「1つ深い」ので深さは「../」になります -->
    <script>var pathToRoot = "../";</script>

    <!-- ★ 共通JSファイルの読み込み（1つ深いフォルダなので「../」が必要です） -->
    <script src="../components/sidebar.js"></script>
    <script src="../components/footer.js"></script>
    
    <script>
        // 共通パーツ読み込み後のナビゲーション初期化
        // 読み込み競合を起こさずに安全に並行実行できるよう、addEventListenerを使用します
        window.addEventListener('load', function() {
            const menuToggle = document.getElementById('menuToggle');
            const leftNav = document.getElementById('leftNav');
            
            if (menuToggle && leftNav) {
                menuToggle.addEventListener('click', function() {
                    leftNav.classList.toggle('is-open');
                    if (leftNav.classList.contains('is-open')) {
                        menuToggle.textContent = 'CLOSE';
                        menuToggle.style.color = '#111';
                    } else {
                        menuToggle.textContent = 'MENU';
                        menuToggle.style.color = 'var(--accent-blue)';
                    }
                });

                // ナビゲーションリンクをクリックしたら閉じる（モバイル時）
                const navLinks = leftNav.querySelectorAll('a');
                navLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        if (window.innerWidth <= 992) {
                            leftNav.classList.remove('is-open');
                            menuToggle.textContent = 'MENU';
                            menuToggle.style.color = 'var(--accent-blue)';
                        }
                    });
                });
            }

            const currentPageId = document.body.getAttribute('data-page');
            if (currentPageId) {
                const targetLink = document.querySelector(`.left-nav a[data-id="${currentPageId}"]`);
                if (targetLink) {
                    if (targetLink.closest('.nav-deep-list')) {
                        targetLink.classList.add('active-deep');
                        targetLink.closest('.has-deep').querySelector('a:first-child').classList.add('active-sub');
                        targetLink.closest('.has-sub').querySelector('a:first-child').classList.add('active');
                    } else if (targetLink.closest('.nav-sub-list')) {
                        targetLink.classList.add('active-sub');
                        targetLink.closest('.has-sub').querySelector('a:first-child').classList.add('active');
                    } else {
                        targetLink.classList.add('active');
                    }
                }
            }
        });
    </script>
</body>
</html>
